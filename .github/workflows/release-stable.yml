name: Build Stable Release

on:
  push:
    tags:
      - stable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install native build tools (clang, lld, mingw-w64)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld g++-mingw-w64-x86-64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadowJar
        run: ./gradlew --no-daemon :mc:1.12.2-forge:clean :mc:1.12.2-forge:shadowJar --console=plain -x test

      - name: Verify jar contents (refmap + Windows/Linux natives)
        run: |
          python3 - <<'EOF'
          import glob, json, zipfile
          jars = glob.glob("mc/1.12.2-forge/build/libs/fp2-*.jar")
          assert len(jars) == 1, f"Expected 1 jar, got {jars}"
          with zipfile.ZipFile(jars[0]) as z:
              names = z.namelist()
              ref = json.loads(z.read("mixins.fp2.refmap.json"))
              mappings = ref.get("mappings", {})
              assert len(mappings) >= 32, f"Unexpected refmap size: {len(mappings)}"
              dlls = [n for n in names if n.endswith(".dll")]
              sos = [n for n in names if n.endswith(".so")]
              print(f"Verified {jars[0]}: refmap={len(mappings)}, dlls={len(dlls)}, sos={len(sos)}")
              assert len(dlls) >= 25, f"Expected at least 25 .dlls, got {len(dlls)}"
              assert len(sos) >= 25, f"Expected at least 25 .sos, got {len(sos)}"
          EOF

      - name: Publish to stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR_FILE=$(ls mc/1.12.2-forge/build/libs/fp2-*.jar | head -n 1)
          RELEASE_NOTES=$(git tag -l --format='%(contents)' stable 2>/dev/null)
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES=$(git log -1 --pretty=%B)
          fi
          if gh release view stable >/dev/null 2>&1; then
            for asset in $(gh release view stable --json assets -q '.assets[].name'); do
              gh release delete-asset stable "$asset" -y
            done
            gh release upload stable "$JAR_FILE" --clobber
            gh release edit stable --title "Stable Build" --notes "$RELEASE_NOTES"
          else
            gh release create stable "$JAR_FILE" --title "Stable Build" --notes "$RELEASE_NOTES"
          fi
